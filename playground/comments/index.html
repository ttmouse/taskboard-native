<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评论回复效果 · 静态演示</title>
<style>
  :root {
    --pg-bg: #ececf0;
    --pg-bar: #ffffff;
    --pg-text: #18181b;
    --pg-muted: #71717a;
    --pg-border: #d9d9de;
    --pg-hover: #e9e9ec;
  }
  :root[data-theme="dark"] {
    --pg-bg: #0f0f11;
    --pg-bar: #18181b;
    --pg-text: #f4f4f5;
    --pg-muted: #a1a1aa;
    --pg-border: #3f3f46;
    --pg-hover: #27272a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--pg-bg);
    color: var(--pg-text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- page chrome (not part of the mocked app) ---------- */
  .pg-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--pg-bar);
    border-bottom: 1px solid var(--pg-border);
    flex-wrap: wrap;
  }
  .pg-title { font-size: 13px; font-weight: 600; }
  .pg-sub { font-size: 11px; color: var(--pg-muted); }
  .pg-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .pg-btn {
    font: inherit; font-size: 11px; line-height: 1.3;
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--pg-border);
    background: transparent; color: var(--pg-text);
    cursor: pointer;
  }
  .pg-btn:hover { background: var(--pg-hover); }
  .pg-btn[aria-pressed="true"] {
    background: rgba(37, 99, 235, 0.12);
    border-color: transparent;
    color: #2563eb;
  }
  :root[data-theme="dark"] .pg-btn[aria-pressed="true"] { color: #3b82f6; }
  .seg { display: inline-flex; border: 1px solid var(--pg-border); border-radius: 6px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 11px; padding: 4px 10px; border: 0;
    background: transparent; color: var(--pg-muted); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--pg-border); }
  .seg button[aria-pressed="true"] { background: var(--pg-hover); color: var(--pg-text); }

  .stage {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 24px 48px;
  }
  .hint {
    max-width: 720px;
    margin: 0 auto 24px;
    font-size: 11px;
    line-height: 1.7;
    color: var(--pg-muted);
    padding: 0 24px;
  }
  .hint code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
    background: var(--pg-hover);
    border-radius: 4px;
    padding: 1px 4px;
  }

  /* ---------- mocked task detail pane ---------- */
  .pane {
    --bg: #ffffff;
    --surface: #f4f4f5;
    --surface-hover: #e9e9ec;
    --surface-pressed: #dddde1;
    --border: #d9d9de;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
    --danger: #dc2626;

    --bubble-bg: rgba(233, 233, 236, 0.55);
    --composer-bg: rgba(233, 233, 236, 0.4);
    --chip-bg: rgba(37, 99, 235, 0.16);

    width: 720px;
    max-width: calc(100vw - 48px);
    height: min(880px, calc(100vh - 190px));
    min-height: 520px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px 24px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
    font-size: 13px;
  }
  .pane[data-theme="dark"] {
    --bg: #18181b;
    --surface: #27272a;
    --surface-hover: #323236;
    --surface-pressed: #3c3c41;
    --border: #3f3f46;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #3b82f6;
    --danger: #ef4444;

    --bubble-bg: rgba(50, 50, 54, 0.55);
    --composer-bg: rgba(50, 50, 54, 0.4);
    --chip-bg: rgba(59, 130, 246, 0.16);
  }

  .pane-head { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .pane-head h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .pane-head .spacer { flex: 1; }

  .btn {
    font: inherit;
    font-size: 13px;
    line-height: 1.25;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn:active { background: var(--surface-pressed); }

  .pane-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-right: 2px;
  }

  .task-title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.45;
    border: 0;
    background: transparent;
    padding: 0;
    color: var(--text);
    width: 100%;
    outline: none;
  }
  .section-label { font-size: 12px; color: var(--muted); }
  .task-body {
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .task-body p { margin: 0; }
  .task-body p + p { margin-top: 8px; }

  .comments-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .comments-head .count { font-weight: 400; }

  .threads { display: flex; flex-direction: column; gap: 8px; }

  .comment {
    background: var(--bubble-bg);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }

  .c-head { display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--surface-pressed);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 600;
    flex-shrink: 0;
    user-select: none;
  }
  .author {
    font-size: 12px;
    font-weight: 600;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mention { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .c-head .spacer { flex: 1; }
  .time { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .more {
    width: 22px;
    height: 22px;
    padding: 0;
    margin-right: -4px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .more:hover { background: var(--surface-hover); }
  .more:active { background: var(--surface-pressed); }

  .quote {
    background: var(--surface);
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: relative;
  }
  .quote-who { font-size: 11px; font-weight: 600; color: var(--muted); }
  .quote-text {
    font-size: 11px;
    line-height: 1.5;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .quote-missing { font-size: 11px; color: var(--muted); }

  .md { font-size: 13px; line-height: 1.6; word-break: break-word; }
  .md p { margin: 0; }
  .md p + p { margin-top: 6px; }
  .md ul { margin: 4px 0; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    background: var(--surface);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .md pre {
    margin: 6px 0;
    padding: 8px 10px;
    background: var(--surface);
    border-radius: 6px;
    overflow-x: auto;
    font-size: 12px;
    line-height: 1.5;
  }
  .md pre code { background: transparent; padding: 0; }

  .followup { align-self: flex-start; }

  .edit-area {
    width: 100%;
    min-height: 64px;
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    resize: vertical;
    outline: none;
  }
  .edit-actions { display: flex; gap: 8px; }

  /* ---------- composer ---------- */
  .composer {
    flex-shrink: 0;
    background: var(--composer-bg);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  .composer-row { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .chips { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .chip {
    font: inherit;
    font-size: 11px;
    line-height: 1.4;
    padding: 2px 4px;
    border: 0;
    border-radius: 8px;
    background: var(--chip-bg);
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chip .x { opacity: 0.7; }
  .chip:hover .x { opacity: 1; }
  .draft {
    flex: 1;
    min-height: 20px;
    max-height: 96px;
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    line-height: 1.45;
    resize: none;
    outline: none;
  }
  .draft::placeholder { color: var(--muted); }

  /* ---------- floating menus ---------- */
  .menu {
    position: absolute;
    z-index: 20;
    min-width: 132px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .menu button {
    font: inherit;
    font-size: 12px;
    text-align: left;
    padding: 6px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .menu button:hover { background: var(--surface-hover); }
  .menu button.danger { color: var(--danger); }
  .mention-menu { bottom: calc(100% + 6px); left: 10px; }
  .more-menu { top: 30px; right: 8px; }

  /* ---------- annotation mode ---------- */
  .annotate .comment { outline: 1px dashed var(--accent); outline-offset: 2px; }
  .annotate .quote { outline: 1px dashed #d97706; outline-offset: 2px; }
  .annotate .composer { outline: 1px dashed #16a34a; outline-offset: 2px; }
  .annotate .quote::after,
  .annotate .comment::after,
  .annotate .composer::after {
    position: absolute;
    top: -9px;
    right: 8px;
    font-size: 9px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    pointer-events: none;
  }
  .annotate .quote::after { content: "引用块"; }
  .annotate .composer::after { content: "输入框"; }
  .annotate .comment[data-depth="0"]::after { content: "根评论"; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: var(--pg-text);
    color: var(--pg-bar);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    .stage { padding: 16px 16px 32px; }
    .pane { padding: 16px; height: calc(100vh - 150px); }
    .author { max-width: 100px; }
  }
</style>
</head>
<body data-theme="light">

  <header class="pg-bar">
    <span class="pg-title">任务详情 · 评论回复效果</span>
    <span class="pg-sub">静态演示页 · 样例数据，不写入看板</span>
    <div class="pg-actions">
      <button class="pg-btn" id="annotate-btn" aria-pressed="false">标注结构</button>
      <div class="seg" role="group" aria-label="外观">
        <button data-theme-btn="light" aria-pressed="true">浅色</button>
        <button data-theme-btn="dark" aria-pressed="false">深色</button>
      </div>
    </div>
  </header>

  <p class="hint">
    点任意评论上的「回复」设定回复目标，输入框出现 <code>回复 @作者 ×</code> 提示条；输入 <code>@</code> 选择跟进渠道；
    <code>Enter</code> 发送，<code>Shift+Enter</code> 换行。自己（豆爸）的评论可编辑或删除，删除父评论后子回复会升为顶层。演示数据不会写入看板。
  </p>

  <main class="stage">
    <section class="pane" id="pane" data-theme="light" aria-label="任务详情">
      <div class="pane-head">
        <h1>任务详情</h1>
        <span class="spacer"></span>
        <button class="btn" id="close-btn">关闭</button>
      </div>

      <div class="pane-body" id="pane-body">
        <input class="task-title" value="评论的回复效果需要单独用静态页面生成 playground，让我看一下效果。" aria-label="任务标题">
        <div>
          <div class="section-label">任务正文</div>
          <div class="task-body">回复结构要能一眼看出在回哪一条：被回复作者 + 原文摘要，深层层级逐级缩进（最多 5 层）。</div>
        </div>
        <div>
          <div class="comments-head"><span>评论</span><span class="count" id="comment-count"></span></div>
          <div class="threads" id="threads" style="margin-top:8px"></div>
        </div>
      </div>

      <div class="composer" id="composer">
        <div class="menu mention-menu" id="mention-menu" hidden></div>
        <div class="composer-row">
          <div class="chips" id="chips"></div>
          <textarea class="draft" id="draft" rows="1" aria-label="写评论"
            placeholder="写评论… 输入 @ 可指定跟进给谁"></textarea>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var CHANNELS = [
    { id: "dsh", label: "DSH" },
    { id: "codex", label: "Codex" },
    { id: "pi", label: "Pi Agent" },
    { id: "claude", label: "Claude Code" }
  ];
  var CHANNEL_LABEL = {};
  CHANNELS.forEach(function (c) { CHANNEL_LABEL[c.id] = c.label; });

  var self = "豆爸";
  var comments = [
    { id: "c1", author: "豆爸", at: "10-31 15:02", parent: null, mention: null,
      text: "回复的结构还是看不出来在回谁。\n引用块要更明确一点，别只是一行灰字。" },
    { id: "c2", author: "Claude Code", at: "10-31 15:04", parent: "c1", mention: "claude",
      text: "已经改成引用卡了：上面一行「回复给 豆爸」，下面是原评论的两行摘要，超出两行才省略。" },
    { id: "c3", author: "豆爸", at: "10-31 15:06", parent: "c2", mention: null,
      text: "那嵌套三层以上呢？缩进会不会把气泡挤没？" },
    { id: "c4", author: "Claude Code", at: "10-31 15:06", parent: "c3", mention: null,
      text: "每层 12px，最多 5 层，之后不再加缩进。" },
    { id: "c5", author: "豆爸", at: "10-31 15:07", parent: "c4", mention: null,
      text: "试一下第五层。" },
    { id: "c6", author: "Claude Code", at: "10-31 15:07", parent: "c5", mention: null,
      text: "这是第五层，缩进到这里就停了。" },
    { id: "c7", author: "豆爸", at: "10-31 15:08", parent: "c6", mention: null,
      text: "第六层也保持同样的缩进。" },
    { id: "c8", author: "Codex", at: "10-31 14:40", parent: null, mention: null,
      text: "整理一下现状：\n\n- 引用块用 `Surface` 底色，6px 圆角\n- 作者加粗，时间右对齐\n- 回复按钮放在每个评论头部\n\n**结论**：结构没问题，主要是按钮太抢眼。" },
    { id: "c9", author: "豆爸", at: "10-31 14:52", parent: "c8", mention: null,
      text: "按钮确实有点重，回头再收。" },
    { id: "c10", author: "豆爸", at: "10-31 14:58", parent: "gone", mention: null,
      text: "这条回复的父评论已经不存在，用来演示「回复的评论已不可用」的兜底。" },
    { id: "c11", author: "豆爸", at: "10-31 15:10", parent: null, mention: "codex",
      text: "还有一点：回复如果很长，引用块只取前两行，鼠标悬停看全文。" },
    { id: "c12", author: "Claude Code", at: "10-31 15:11", parent: "c11", mention: null,
      text: "嗯，摘要用 Fields 压成一行，超长才省略。" }
  ];

  var seq = 100;
  var state = { replyTo: null, mention: "", editing: null, menuFor: null, mentionOpen: false };

  var pane = document.getElementById("pane");
  var body = document.getElementById("pane-body");
  var threads = document.getElementById("threads");
  var chips = document.getElementById("chips");
  var draft = document.getElementById("draft");
  var mentionMenu = document.getElementById("mention-menu");
  var countEl = document.getElementById("comment-count");
  var toastEl = document.getElementById("toast");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  // commentMarkdown keeps newlines visible; reproduce that as hard breaks.
  function md(src) {
    var lines = String(src).replace(/\\n/g, "\n").split("\n");
    var out = [];
    var para = [];
    var list = false;
    var fence = false;
    var code = [];

    function flushPara() {
      if (para.length) {
        out.push("<p>" + para.map(inline).join("<br>") + "</p>");
        para = [];
      }
    }
    function closeList() {
      if (list) { out.push("</ul>"); list = false; }
    }

    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = raw.replace(/\s+$/, "");

      if (/^```/.test(line)) {
        if (fence) {
          out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
          code = [];
          fence = false;
        } else {
          flushPara(); closeList();
          fence = true;
        }
        continue;
      }
      if (fence) { code.push(raw); continue; }

      if (/^\s*[-*]\s+/.test(line)) {
        flushPara();
        if (!list) { out.push("<ul>"); list = true; }
        out.push("<li>" + inline(line.replace(/^\s*[-*]\s+/, "")) + "</li>");
        continue;
      }
      closeList();

      if (line.trim() === "") { flushPara(); continue; }
      para.push(line);
    }
    if (fence) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
    flushPara(); closeList();
    return out.join("");
  }

  function flatten() {
    var children = {};
    var known = {};
    comments.forEach(function (c) { known[c.id] = true; });
    comments.forEach(function (c) {
      if (c.parent) {
        (children[c.parent] = children[c.parent] || []).push(c);
      }
    });
    var roots = comments.filter(function (c) {
      return !c.parent || !known[c.parent];
    });
    var list = [];
    function walk(c, depth) {
      list.push({ c: c, depth: depth });
      var kids = children[c.id] || [];
      for (var i = kids.length - 1; i >= 0; i--) walk(kids[i], depth + 1);
    }
    for (var i = roots.length - 1; i >= 0; i--) walk(roots[i], 0);
    return list;
  }

  function preview(text) {
    var flat = String(text).split(/\s+/).filter(Boolean).join(" ");
    return flat === "" ? "（空评论）" : flat;
  }

  function byID(id) {
    for (var i = 0; i < comments.length; i++) if (comments[i].id === id) return comments[i];
    return null;
  }

  function icon(name) {
    if (name === "more") {
      return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';
    }
    return "";
  }

  function render() {
    var rows = flatten();
    var html = "";
    rows.forEach(function (row) {
      var c = row.c;
      var depth = row.depth;
      var indent = Math.min(depth, 5) * 12;
      var parent = c.parent ? byID(c.parent) : null;
      var isSelf = c.author === self;

      html += '<article class="comment" data-id="' + esc(c.id) + '" data-depth="' + depth + '"' +
        ' style="padding-left:' + (12 + indent) + 'px">';
      html += '<header class="c-head">';
      html += '<span class="avatar">' + esc(String(c.author).trim().slice(0, 1)) + "</span>";
      html += '<span class="author" title="' + esc(c.author) + '">' + esc(c.author) + "</span>";
      if (c.mention) {
        html += '<span class="mention" title="这条评论指定由 ' + esc(CHANNEL_LABEL[c.mention] || c.mention) + ' 处理">@' +
          esc(CHANNEL_LABEL[c.mention] || c.mention) + "</span>";
      }
      html += '<span class="spacer"></span>';
      html += '<span class="time">' + esc(c.at) + "</span>";
      html += '<button class="btn" data-action="reply" data-id="' + esc(c.id) + '" aria-label="回复评论" title="回复这条评论">回复</button>';
      if (isSelf) {
        html += '<button class="more" data-action="more" data-id="' + esc(c.id) + '" aria-label="更多评论操作" title="更多评论操作">' + icon("more") + "</button>";
        if (state.menuFor === c.id) {
          html += '<div class="menu more-menu" data-menu="' + esc(c.id) + '">' +
            '<button data-action="edit" data-id="' + esc(c.id) + '">编辑</button>' +
            '<button class="danger" data-action="delete" data-id="' + esc(c.id) + '">删除</button>' +
            "</div>";
        }
      }
      html += "</header>";

      if (c.parent) {
        html += '<div class="quote">';
        if (!parent) {
          html += '<div class="quote-missing">回复的评论已不可用</div>';
        } else {
          html += '<div class="quote-who" title="回复给 ' + esc(parent.author) + '">回复给 ' + esc(parent.author) + "</div>";
          html += '<div class="quote-text" title="' + esc(parent.text) + '">' + esc(preview(parent.text)) + "</div>";
        }
        html += "</div>";
      }

      if (state.editing === c.id) {
        html += '<textarea class="edit-area" data-edit="' + esc(c.id) + '" aria-label="编辑评论内容">' + esc(c.text) + "</textarea>";
        html += '<div class="edit-actions">' +
          '<button class="btn" data-action="save-edit" data-id="' + esc(c.id) + '">保存</button>' +
          '<button class="btn" data-action="cancel-edit" data-id="' + esc(c.id) + '">取消</button>' +
          "</div>";
      } else {
        html += '<div class="md">' + md(c.text) + "</div>";
      }

      if (isSelf && !c.mention) {
        html += '<button class="btn followup" data-action="followup" data-id="' + esc(c.id) + '" title="把这条评论交回任务的原始 AI 会话">让 AI 跟进</button>';
      }
      html += "</article>";
    });

    threads.innerHTML = html;
    countEl.textContent = String(comments.length);
    renderChips();
    updatePlaceholder();
  }

  function renderChips() {
    var html = "";
    if (state.replyTo) {
      var target = byID(state.replyTo);
      if (target) {
        html += '<button class="chip" data-action="clear-reply" title="正在回复 @' + esc(target.author) + '；点击取消" aria-label="取消回复目标">' +
          "回复 @" + esc(target.author) + ' <span class="x">×</span></button>';
      } else {
        state.replyTo = null;
      }
    }
    if (state.mention) {
      var label = CHANNEL_LABEL[state.mention] || state.mention;
      html += '<button class="chip" data-action="clear-mention" title="发送后交给 ' + esc(label) + '；点击取消" aria-label="取消提醒 ' + esc(label) + '">@' +
        esc(label) + ' <span class="x">×</span></button>';
    }
    chips.innerHTML = html;
  }

  function updatePlaceholder() {
    if (state.mention) {
      draft.placeholder = "发送后交给 " + (CHANNEL_LABEL[state.mention] || state.mention) + " 跟进…";
    } else {
      draft.placeholder = "写评论… 输入 @ 可指定跟进给谁";
    }
  }

  function autoGrow() {
    draft.style.height = "auto";
    draft.style.height = Math.min(draft.scrollHeight, 96) + "px";
  }

  function nowLabel() {
    var d = new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 60000);
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function send() {
    var text = draft.value.trim();
    if (!text) return;
    var c = {
      id: "n" + (seq++),
      author: self,
      at: nowLabel(),
      parent: state.replyTo,
      mention: state.mention || null,
      text: text
    };
    comments.push(c);
    draft.value = "";
    state.replyTo = null;
    state.mention = "";
    state.mentionOpen = false;
    mentionMenu.hidden = true;
    autoGrow();
    render();
    var el = threads.querySelector('[data-id="' + c.id + '"]');
    if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    draft.focus();
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
  }

  function openMentionMenu() {
    state.mentionOpen = true;
    mentionMenu.hidden = false;
    mentionMenu.innerHTML = CHANNELS.map(function (c) {
      return '<button data-action="pick-channel" data-channel="' + c.id + '">@' + esc(c.label) + "</button>";
    }).join("");
  }

  function closeMentionMenu() {
    state.mentionOpen = false;
    mentionMenu.hidden = true;
  }

  // ----- events -----

  threads.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) {
      if (state.menuFor) {
        state.menuFor = null;
        render();
      }
      return;
    }
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");

    if (action === "reply") {
      state.replyTo = id;
      state.menuFor = null;
      render();
      draft.focus();
      return;
    }
    if (action === "more") {
      state.menuFor = state.menuFor === id ? null : id;
      render();
      return;
    }
    if (action === "edit") {
      state.editing = id;
      state.menuFor = null;
      render();
      var area = threads.querySelector('[data-edit="' + id + '"]');
      if (area) { area.focus(); area.setSelectionRange(area.value.length, area.value.length); }
      return;
    }
    if (action === "delete") {
      comments = comments.filter(function (c) { return c.id !== id; });
      comments.forEach(function (c) { if (c.parent === id) c.parent = null; });
      if (state.replyTo === id) state.replyTo = null;
      state.menuFor = null;
      render();
      return;
    }
    if (action === "save-edit") {
      var edit = threads.querySelector('[data-edit="' + id + '"]');
      var target = byID(id);
      if (edit && target) {
        var next = edit.value.trim();
        if (next) target.text = next;
      }
      state.editing = null;
      render();
      return;
    }
    if (action === "cancel-edit") {
      state.editing = null;
      render();
      return;
    }
    if (action === "followup") {
      toast("静态演示页：这里会把评论交回原会话，不会真的派发。");
      return;
    }
  });

  chips.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    if (btn.getAttribute("data-action") === "clear-reply") state.replyTo = null;
    if (btn.getAttribute("data-action") === "clear-mention") state.mention = "";
    render();
    draft.focus();
  });

  mentionMenu.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action='pick-channel']");
    if (!btn) return;
    var channel = btn.getAttribute("data-channel");
    state.mention = channel;
    draft.value = draft.value.replace(/\s*@\s*$/, "");
    closeMentionMenu();
    render();
    draft.focus();
  });

  draft.addEventListener("input", function () {
    autoGrow();
    var value = draft.value;
    var atEnd = /(^|\s)@$/.test(value);
    if (atEnd && !state.mention && !state.mentionOpen) {
      openMentionMenu();
    } else if (!/(^|\s)@\S*$/.test(value) && state.mentionOpen) {
      closeMentionMenu();
    }
  });

  draft.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
    if (e.key === "Backspace" && draft.value === "" && state.mention) {
      e.preventDefault();
      state.mention = "";
      render();
    }
    if (e.key === "Escape" && state.mentionOpen) {
      closeMentionMenu();
    }
  });

  document.addEventListener("click", function (e) {
    if (state.mentionOpen && !mentionMenu.contains(e.target) && e.target !== draft) {
      closeMentionMenu();
    }
  });

  document.getElementById("annotate-btn").addEventListener("click", function () {
    var on = this.getAttribute("aria-pressed") !== "true";
    this.setAttribute("aria-pressed", String(on));
    pane.classList.toggle("annotate", on);
  });

  document.querySelectorAll("[data-theme-btn]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var theme = btn.getAttribute("data-theme-btn");
      document.body.setAttribute("data-theme", theme);
      pane.setAttribute("data-theme", theme);
      document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
    });
  });

  document.getElementById("close-btn").addEventListener("click", function () {
    toast("静态演示页：详情面板由主窗口打开和关闭。");
  });

  render();
  autoGrow();
})();
</script>
</body>
</html>
